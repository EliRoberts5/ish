name: Build iOS App

on:
  workflow_dispatch: # Allows you to manually click "Run" in your browser

jobs:
  build:
    runs-on: macos-15 # Uses an actual Apple cloud server running Xcode

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app # Adjust to the version the project needs

      - name: Resolve Dependencies
        run: |
          if [ -f "Podfile" ]; then pod install; fi
          xcodebuild -resolvePackageDependencies

      - name: Build Xcode Project (Unsigned for Testing/Simulator)
        run: |
          xcodebuild -project *.xcodeproj \
                     -scheme "YourSchemeName" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p payload/Payload
          mv build/Release-iphoneos/*.app payload/Payload/
          cd payload && zip -r ../app-unsigned.ipa Payload

      - name: Upload Finished App Package
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app-unsigned.ipa
