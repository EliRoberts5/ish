name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-ios:
    name: iOS .ipa build
    runs-on: macos-15
    timeout-minutes: 90

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Meson and build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install meson ninja
          brew install libarchive llvm lld || true

      - name: Select Xcode version
        shell: bash
        run: |
          set -euxo pipefail
          for xcode in \
            "/Applications/Xcode_16.4.app/Contents/Developer" \
            "/Applications/Xcode_16.3.app/Contents/Developer" \
            "/Applications/Xcode_16.2.app/Contents/Developer" \
            "/Applications/Xcode_16.1.app/Contents/Developer" \
            "/Applications/Xcode_16.0.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -switch "$xcode"
              xcodebuild -version
              exit 0
            fi
          done
          echo "No usable Xcode found on runner" >&2
          exit 1

      - name: Resolve Xcode dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update || pod install
          fi
          xcodebuild -resolvePackageDependencies -project iSH.xcodeproj

      - name: Import Apple signing certificate and profile
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.APPLE_BUNDLE_ID != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Build signed iOS app
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.APPLE_BUNDLE_ID != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme "iSH" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Build unsigned iOS app
        if: ${{ env.APPLE_CERTIFICATE_BASE64 == '' || env.APPLE_PROVISIONING_PROFILE_BASE64 == '' || env.APPLE_TEAM_ID == '' || env.APPLE_BUNDLE_ID == '' }}
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme "iSH" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="app.ish.build" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package .ipa artifact
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH=$(find build/DerivedData -path '*/Build/Products/Release-iphoneos/*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced by xcodebuild" >&2
            find build/DerivedData -maxdepth 10 -iname '*.app' | head -50 >&2 || true
            exit 1
          fi

          if [[ -n "$APPLE_CERTIFICATE_BASE64" && -n "$APPLE_PROVISIONING_PROFILE_BASE64" && -n "$APPLE_TEAM_ID" && -n "$APPLE_BUNDLE_ID" ]]; then
            IPA_NAME="iSH-signed.ipa"
          else
            IPA_NAME="iSH-unsigned.ipa"
          fi

          mkdir -p payload/Payload
          cp -R "$APP_PATH" payload/Payload/
          cd payload
          zip -qr "../$IPA_NAME" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.APPLE_BUNDLE_ID != '' && 'iSH-signed-ipa' || 'iSH-unsigned-ipa' }}
          path: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.APPLE_BUNDLE_ID != '' && 'iSH-signed.ipa' || 'iSH-unsigned.ipa' }}
          if-no-files-found: error
